name: Financial Living System package refactor

on:
  push:
    branches:
      - refactor/financial-living-system-readmes-download
    paths:
      - .github/workflows/build-financial-living-system-package.yml

permissions:
  contents: write

jobs:
  refactor-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor and package
        run: python .github/refactor_financial_living_system.py

      - name: Commit generated public refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refactor Financial Living System namespace and public entrypoints"
          git push

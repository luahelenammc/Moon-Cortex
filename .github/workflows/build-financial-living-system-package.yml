name: Financial Living System package refactor

on:
  push:
    branches:
      - refactor/financial-living-system-readmes-download
    paths:
      - .github/workflows/build-financial-living-system-package.yml

permissions:
  contents: write

jobs:
  refactor-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor namespace, rewrite READMEs, and build module ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          root = Path('.')
          old_module = root / 'modules' / 'finance-bootstrap'
          module = root / 'modules' / 'financial-living-system'

          if old_module.exists() and not module.exists():
              old_module.rename(module)

          old_bootstrap = module / 'FINANCE_BOOTSTRAP_SEED.md'
          bootstrap = module / 'ADAPTIVE_FINANCE_BOOTSTRAP.md'
          if old_bootstrap.exists() and not bootstrap.exists():
              old_bootstrap.rename(bootstrap)

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # Bump current module-facing version references without rewriting changelog history.
          for path in module.rglob('*.md'):
              if path.name == 'CHANGELOG.md':
                  continue
              text = read(path)
              text = text.replace('0.1.0-pre.2', '0.1.0-pre.3')
              write(path, text)

          # Canonical path corrections in current public contracts.
          targeted = [
              root / 'ARCHITECTURE.md',
              root / 'PUBLIC_BOUNDARY.md',
              root / 'LICENSING.md',
              root / 'NOTICE',
              module / 'docs' / 'FINANCIAL_REALITY_TEST.md',
              module / 'docs' / 'PRIVACY_AND_CLAIMS.md',
              bootstrap,
          ]
          for path in targeted:
              text = read(path)
              text = text.replace('modules/finance-bootstrap/FINANCE_BOOTSTRAP_SEED.md', 'modules/financial-living-system/ADAPTIVE_FINANCE_BOOTSTRAP.md')
              text = text.replace('modules/finance-bootstrap/', 'modules/financial-living-system/')
              text = text.replace('FINANCE_BOOTSTRAP_SEED.md', 'ADAPTIVE_FINANCE_BOOTSTRAP.md')
              write(path, text)

          architecture = read(root / 'ARCHITECTURE.md')
          architecture = architecture.replace('0.1.0-pre.2', '0.1.0-pre.3')
          architecture = architecture.replace(
              'The historical filename `ADAPTIVE_FINANCE_BOOTSTRAP.md` is retained for path stability. Its current semantic role is the **Adaptive Finance Bootstrap** for the Financial Living System.\n',
              'The canonical public transport artifact is now named for its actual role: `modules/financial-living-system/ADAPTIVE_FINANCE_BOOTSTRAP.md`. The pre-release namespace therefore distinguishes the **Financial Living System** module from the **Adaptive Finance Bootstrap** mechanism that instantiates it.\n'
          )
          write(root / 'ARCHITECTURE.md', architecture)

          licensing = read(root / 'LICENSING.md')
          licensing = licensing.replace('## License map for `0.1.0-pre.2`', '## License map for `0.1.0-pre.3`')
          write(root / 'LICENSING.md', licensing)

          bootstrap_text = read(bootstrap)
          bootstrap_text = bootstrap_text.replace(
              '**Path note:** historical filename retained for stable links; the mechanism\'s current name is **Adaptive Finance Bootstrap**',
              '**Artifact role:** canonical generative instantiation interface for the **Financial Living System**'
          )
          write(bootstrap, bootstrap_text)


name: Verify public skill packages
on:
  pull_request:
    paths:
      - "modules/**"
      - "skills/**"
      - "downloads/skills/**"
      - "scripts/build_skill_packages.py"
      - "LICENSES/**"
      - "LICENSING.md"
      - "NOTICE"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_skill_packages.py --check

# Temporary same-repository PR portable synchronization. Remove before merge.
name: One-off Web Retro Windows subtheme ZIP sync
on:
  pull_request:
    paths:
      - "modules/moon-image-cortex/**"
      - "scripts/check_moon_image_cortex_package.py"
      - "scripts/test_moon_image_cortex_package.py"
      - ".github/workflows/image-cortex-windows-subthemes-one-off-sync.yml"
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'feat/web-retro-four-windows-subthemes-20261009' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_moon_image_cortex_package.py
      - run: python scripts/check_moon_image_cortex_package.py
      - run: python scripts/test_moon_image_cortex_package.py
      - name: Commit validated package to pull-request branch
        run: |
          git add downloads/moon-image-cortex.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(image): synchronize grouped Windows-era subthemes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# Temporary same-repo PR packaging lane; remove before merge.
name: One-off Moon Image Cortex README package synchronization
on:
  pull_request:
    paths:
      - "modules/moon-image-cortex/README.md"
      - ".github/workflows/image-cortex-one-off-readme-package-sync.yml"
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'docs/image-cortex-readme-use-cases-tables-20261009' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_moon_image_cortex_package.py
      - name: Commit rebuilt portable to PR branch
        run: |
          git add downloads/moon-image-cortex.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(image): sync improved README into portable ZIP"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

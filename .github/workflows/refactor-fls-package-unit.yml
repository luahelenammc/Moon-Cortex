name: Financial Living System package-unit refactor

on:
  push:
    branches:
      - refactor/fls-package-unit
    paths:
      - .github/workflows/refactor-fls-package-unit.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply package-unit refactor
        run: python .github/refactor_fls_package_unit.py
      - name: Commit generated public changes
        run: |
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git add README.md ARCHITECTURE.md LICENSING.md CHANGELOG.md modules/financial-living-system downloads/financial-living-system.zip
          git diff --cached --quiet && exit 0
          git commit -m "Make Financial Living System a package-first public module"
          git push origin HEAD:refactor/fls-package-unit

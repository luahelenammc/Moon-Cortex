name: One-shot version visibility normalization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meta/drop-public-version-suffix-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/_one_shot_version_visibility_normalize.py
      - run: python scripts/check_version_visibility.py
      - run: python scripts/check_title_version_separation.py
      - run: python scripts/test_title_version_separation.py
      - name: Commit normalized Moon Cortex branch
        run: |
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git add -A
          git commit -m "meta: make version tokens visibility-neutral"
          git push origin HEAD:meta/drop-public-version-suffix-20260909
